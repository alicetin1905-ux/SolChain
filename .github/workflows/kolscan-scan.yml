name: Scan Kolscan traders

on:
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run must start from the newest data, not the commit it was queued on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take a short look at every Kolscan trader
        env:
          SOL_RPC: ${{ secrets.SOL_RPC }}
          RPC_THREADS: ${{ vars.RPC_THREADS || '2' }}
        run: python -u scripts/kolscan_scan.py data
      - name: Score the promising ones properly
        env:
          SOL_RPC: ${{ secrets.SOL_RPC }}
          RPC_THREADS: ${{ vars.RPC_THREADS || '2' }}
          WALLET_TXS: "250"
          DAYS: "30"
        run: |
          export SCORE_ONLY="$(python -c "import json; print(' '.join(r['wallet'] for r in json.load(open('data/kol_scan.json'))['promising']))")"
          [ -n "$SCORE_ONLY" ] && python -u scripts/score.py data || echo "nothing promising to score"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kol_scan.json data/scores.json data/fill_gaps.json
          git diff --cached --quiet && exit 0
          git commit -m "Scan Kolscan traders"
          git pull --rebase origin main
          git push
