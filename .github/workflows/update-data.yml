name: Update trader data

on:
  schedule:
    - cron: "47 6 * * *"  # daily, 06:47 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect top traders
        env:
          MAX_PAIRS: "15"
          SWAPS: "1500"
          # Your own Solana RPC URL (repo secret). Without it the free public endpoint is used.
          SOL_RPC: ${{ secrets.SOL_RPC }}
          # Parallel RPC requests; 2 stays near the Helius free plan limit (10 requests/second).
          RPC_THREADS: ${{ vars.RPC_THREADS || '2' }}
        run: |
          mkdir -p out
          python -u scripts/collect.py out
          cp out/*.json data/
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update trader data"
          git push
