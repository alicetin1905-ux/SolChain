name: Score wallets

on:
  schedule:
    - cron: "37 9 * * *"  # daily, after the leaderboard and early-buyer runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score candidate wallets on their recent history
        env:
          SOL_RPC: ${{ secrets.SOL_RPC }}
          RPC_THREADS: ${{ vars.RPC_THREADS || '2' }}
          CANDIDATES: "30"
          WALLET_TXS: "250"
          DAYS: "30"
        run: python -u scripts/score.py data
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --cached --quiet && exit 0
          git commit -m "Update wallet scores"
          git pull --rebase origin main
          git push
